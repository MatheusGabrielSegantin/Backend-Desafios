<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>

    <div>
        <h1>Calcular IMC</h1>

        <form action="/calcular_imc" method="post">

            <label for="peso">Peso</label>
            <input
                type="number"
                id="peso"
                name="peso"
                step="0.01"
                required
            >

            <label for="altura">Altura</label>
            <input
                type="number"
                id="altura"
                name="altura"
                step="0.01"
                required
            >

            <button type="submit">Calcular</button>
        </form>

        {% if imc%}
            <div class="resultado">
                <h2>Resultado do IMC</h2>
                <p><strong>Diagnóstico:</strong> {{ diagnostico }}</p>
                <p><strong>IMC:</strong> {{ imc }}</p>
            </div>
        {% endif %}

    </div>

</body>
</html>
