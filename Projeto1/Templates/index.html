<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto 1</title>
</head>
<body>
    <div class="container">
        <h1>Calcular idade</h1>

        <form action="/calcular_idade" method="post">
            <label for="data">Data de nascimento</label>
            <input type="number" id="data" name="data" step="0.01" required >

            <button type="submit">Calcular</button>
        </form>

        {% if idade %}
        <div class="resultado">
            <h2>Resultado da sua idade</h2>
            <p><strong>Idade: </strong> {{ idade }}</p>
        </div>
        {% endif %}


    </div>

</body>
</html>
