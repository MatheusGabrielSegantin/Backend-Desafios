<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto 2</title>
</head>
<body>

    <div class="container">
        <h1>Conversão de moedas</h1>

        <form action="/converter" method="POST">

            <label for="real">Valor em real</label>
            <input type="number" id="real" name="real" step="0.01" required>

            <button type="submit">Calcular</button>
        </form>

        {% if dolar%}
        <div class="resultado">
            <h2>Resultado da conversão</h2>
            <p><strong>Dolar: </strong> {{ dolar }} </p>
        </div>
        {% endif %}


    </div>


</body>
</html>
